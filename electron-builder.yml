appId: com.ckdfs.interviewqa
productName: InterviewQA
copyright: Copyright © 2026 ckdfs

directories:
  output: dist

# 只打包运行必需的文件：不打包 .venv、node_modules 里的开发依赖、个人简历材料
files:
  - main.js
  - preload.js
  - resume.js
  - resume-context.js
  - package.json
  - config.example.json
  - renderer/**/*
  - resume/README.md
  - stt/**/*.py

win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: InterviewQA-${version}-win-portable.${ext}

mac:
  target:
    - target: zip
      arch:
        - x64
        - arm64
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  identity: null # 无 Apple 开发者证书时不要尝试签名（签名需自备证书并在 CI 配 CSC_* 密钥）
  artifactName: InterviewQA-${version}-mac-${arch}.${ext}

portable:
  artifactName: InterviewQA-${version}-win-portable.${ext}
  requestExecutionLevel: user

dmg:
  artifactName: InterviewQA-${version}-mac-${arch}.${ext}
  writeUpdateInfo: false

asar: true
npmRebuild: false
